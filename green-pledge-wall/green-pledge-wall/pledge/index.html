<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#EEF5EC">
  <title>Green Pledge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared/theme.css">
  <link rel="stylesheet" href="/pledge/pledge.css">
</head>
<body>
  <header class="bar">
    <span class="brand"><span class="brand-leaf" id="brandLeaf"></span><span data-t="brand"></span></span>
    <div class="lang-switch" role="group" aria-label="Language">
      <button type="button" data-lang="en" lang="en">English</button>
      <button type="button" data-lang="ar" lang="ar">العربية</button>
    </div>
  </header>

  <main id="app">
    <p class="notice" id="notice" role="status" hidden></p>

    <ol class="stepper" id="stepper">
      <li data-step="1"><span class="dot">1</span><span data-t="stepPledge"></span></li>
      <li data-step="2"><span class="dot">2</span><span data-t="stepDetails"></span></li>
    </ol>

    <!-- Step 1: pick or write a pledge -->
    <section class="step" id="stepPick" aria-labelledby="pickTitle">
      <h1 id="pickTitle" data-t="title"></h1>
      <p class="intro" data-t="intro"></p>

      <div id="presets" role="radiogroup" aria-labelledby="pickTitle"></div>

      <div class="custom" id="customBox" hidden>
        <label for="customText" class="label" data-t="customLabel"></label>
        <div class="textarea-wrap">
          <textarea id="customText" rows="3" maxlength="90" data-ph="customPlaceholder"></textarea>
          <span class="counter" id="customCount" aria-live="polite"></span>
        </div>

        <p class="label" id="colourLabel" data-t="colourLabel"></p>
        <div class="swatches" id="swatches" role="radiogroup" aria-labelledby="colourLabel"></div>

        <div class="preview" id="preview" aria-hidden="true">
          <span class="preview-leaf" id="previewLeaf"></span>
          <span class="preview-body">
            <span class="preview-label" data-t="previewLabel"></span>
            <span class="preview-text" id="previewText"></span>
          </span>
        </div>
      </div>

      <div class="actions">
        <p class="error banner" id="pickError" role="alert"></p>
        <button type="button" class="primary" id="toDetails" data-t="continue"></button>
      </div>
    </section>

    <!-- Step 2: details + consent -->
    <section class="step" id="stepDetails" aria-labelledby="detailsTitle" hidden>
      <h1 id="detailsTitle" data-t="detailsTitle"></h1>
      <p class="intro" data-t="detailsIntro"></p>

      <div class="chosen">
        <span class="chosen-leaf" id="chosenLeaf"></span>
        <p class="chosen-text" id="chosenText"></p>
        <button type="button" class="link" id="backToPick" data-t="change"></button>
      </div>

      <form id="detailsForm" novalidate>
        <div class="field">
          <label class="label" for="fName" data-t="name"></label>
          <input id="fName" name="name" autocomplete="name" maxlength="80" required aria-describedby="eName">
          <p class="error" id="eName"></p>
        </div>
        <div class="field">
          <label class="label" for="fPhone" data-t="phone"></label>
          <input id="fPhone" name="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" dir="ltr" placeholder="+971 5X XXX XXXX" required aria-describedby="ePhone">
          <p class="error" id="ePhone"></p>
        </div>
        <div class="field">
          <label class="label" for="fEmail" data-t="email"></label>
          <input id="fEmail" name="email" type="email" inputmode="email" autocomplete="email" maxlength="120" dir="ltr" placeholder="name@example.com" required aria-describedby="eEmail">
          <p class="error" id="eEmail"></p>
        </div>

        <!-- honeypot: hidden from people, bots fill it -->
        <div class="visually-hidden" aria-hidden="true">
          <label for="fWebsite">Website</label>
          <input id="fWebsite" name="website" tabindex="-1" autocomplete="off">
        </div>

        <div class="actions">
          <p class="error banner" id="submitError" role="alert"></p>
          <button type="submit" class="primary" id="submitBtn" data-t="submit"></button>
          <p class="consent" id="consent"></p>
        </div>
      </form>
    </section>

    <!-- Step 3: done -->
    <section class="step done" id="stepDone" hidden aria-live="polite">
      <div class="done-card">
        <div class="done-leaf" id="doneLeaf"></div>
        <p class="done-name" id="doneName"></p>
        <p class="done-text" id="doneText"></p>
      </div>
      <h1 data-t="doneTitle"></h1>
      <p class="intro" id="doneBody"></p>
      <button type="button" class="primary" id="nextBtn" data-t="nextPerson" hidden></button>
    </section>
  </main>

  <script src="/config.js"></script>
  <script src="/shared/pledges-data.js"></script>
  <script src="/pledge/pledge.js"></script>
</body>
</html>
