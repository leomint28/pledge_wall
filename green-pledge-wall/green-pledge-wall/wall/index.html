<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Green Pledge Wall</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared/theme.css">
  <link rel="stylesheet" href="/wall/wall.css">
</head>
<body>
  <div class="wall" id="wall">
    <header class="head">
      <div class="titles">
        <h1>Green Pledge Wall <span class="ar" lang="ar" dir="rtl">جدار التعهّد الأخضر</span></h1>
        <p class="sub">Each leaf is a student's pledge <span class="ar" lang="ar" dir="rtl">كل ورقة تعهّد من طالب</span></p>
      </div>
      <div class="total" aria-live="polite">
        <span class="total-num" id="total">0</span>
        <span class="total-label">pledges <span class="ar" lang="ar" dir="rtl">تعهّداً</span></span>
      </div>
    </header>

    <div class="field" id="field">
      <svg class="wind" id="wind" aria-hidden="true" preserveAspectRatio="none"></svg>
      <div class="leaves" id="leaves"></div>
      <p class="empty" id="empty" hidden>No leaves yet. Scan the code to add the first one.
        <span class="ar" lang="ar" dir="rtl">لا توجد أوراق بعد. امسح الرمز لإضافة أول ورقة.</span></p>

      <aside class="qr" id="qrPanel">
        <div class="qr-code" id="qr" role="img" aria-label="QR code to the pledge page"></div>
        <p class="qr-text">Scan to add your leaf <span class="ar" lang="ar" dir="rtl">امسح الرمز لإضافة ورقتك</span></p>
        <p class="qr-url" id="qrUrl"></p>
      </aside>
    </div>

    <div class="grass" id="grass" aria-hidden="true"></div>
  </div>

  <!-- leaf brought to the front (click) and new-pledge spotlight -->
  <div class="focus" id="focus" hidden>
    <div class="card" id="card" role="dialog" aria-modal="true" aria-labelledby="cardName">
      <div class="card-leaf" id="cardLeaf"></div>
      <p class="card-name" id="cardName"></p>
      <p class="card-text" id="cardText" dir="auto"></p>
      <p class="card-meta" id="cardMeta" dir="auto"></p>
    </div>
  </div>

  <p class="status" id="status" hidden></p>

  <script src="/config.js"></script>
  <script src="/shared/pledges-data.js"></script>
  <script src="/vendor/supabase-2.45.4.js"></script>
  <script src="/vendor/qrcode-generator-1.4.4.js"></script>
  <script src="/wall/wall.js"></script>
</body>
</html>
