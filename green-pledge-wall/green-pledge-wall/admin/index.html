<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#EEF5EC">
  <title>Green Pledge Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared/theme.css">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <header class="bar">
    <span class="brand"><span id="brandLeaf"></span>Green Pledge Admin</span>
    <span class="who" id="who" hidden><span id="whoEmail"></span><button type="button" class="link" id="signOut">Sign out</button></span>
  </header>

  <main>
    <p class="notice" id="notice" role="status" hidden></p>

    <!-- sign in -->
    <section id="login" class="login" hidden>
      <h1>Sign in</h1>
      <p class="intro">For booth staff. Use the email and password set up for you in Supabase.</p>
      <form id="loginForm" novalidate>
        <label class="label" for="email">Email</label>
        <input id="email" type="email" autocomplete="username" required>
        <label class="label" for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <p class="error" id="loginError" role="alert"></p>
        <button type="submit" class="primary" id="loginBtn">Sign in</button>
      </form>
    </section>

    <!-- dashboard -->
    <section id="dash" hidden>
      <div class="control">
        <div class="switch-row">
          <div>
            <p class="switch-title" id="pauseTitle">Pledging is open</p>
            <p class="switch-help" id="pauseHelp">Students can add pledges from phones and the booth tablet.</p>
          </div>
          <button type="button" class="switch" id="pauseSwitch" role="switch" aria-checked="true" aria-labelledby="pauseTitle">
            <span class="knob"></span>
          </button>
        </div>
      </div>

      <dl class="stats" id="stats">
        <div><dt>Pledges on the wall</dt><dd id="sTotal">–</dd></div>
        <div><dt>Pledges deleted</dt><dd id="sDeleted">–</dd></div>
        <div><dt>Leads collected</dt><dd id="sLeads">–</dd></div>
      </dl>

      <div class="tools">
        <label class="visually-hidden" for="search">Search pledges</label>
        <input id="search" type="search" placeholder="Search by name or message" autocomplete="off">
        <button type="button" class="secondary" id="exportBtn">Export leads (CSV)</button>
      </div>

      <h2 class="list-title" id="listTitle">Latest pledges</h2>
      <ul class="list" id="list" aria-labelledby="listTitle"></ul>
      <p class="empty" id="empty" hidden></p>
      <button type="button" class="secondary more" id="moreBtn" hidden>Load more</button>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="/config.js"></script>
  <script src="/shared/pledges-data.js"></script>
  <script src="/vendor/supabase-2.118.0.js"></script>
  <script src="/admin/admin.js"></script>
</body>
</html>
